name: Cuerda crash test

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build Cuerda
        run: gradle :cuerda:assembleDebug --no-daemon -q
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r cuerda/build/outputs/apk/debug/cuerda-debug.apk
            adb shell pm grant com.davacada.cuerda android.permission.RECORD_AUDIO || true
            adb logcat -c
            adb shell am start -n com.davacada.cuerda/.CuerdaActivity
            sleep 12
            adb exec-out screencap -p > shot1.png || true
            W=$(adb shell wm size | grep -o '[0-9]*x[0-9]*' | tail -1 | cut -dx -f1); H=$(adb shell wm size | grep -o '[0-9]*x[0-9]*' | tail -1 | cut -dx -f2)
            adb shell input tap $((W*55/100)) $((H-H*4/100)); sleep 6
            adb exec-out screencap -p > shot2.png || true
            adb shell input tap $((W*50/100)) $((H-H*11/100)); sleep 8
            adb exec-out screencap -p > shot3.png || true
            adb shell input tap $((W*85/100)) $((H-H*4/100)); sleep 5
            adb exec-out screencap -p > shot4.png || true
            adb logcat -d > logcat.txt || true
            for f in shot1 shot2 shot3 shot4; do echo "BEGIN-$f"; base64 -w0 $f.png; echo; echo "END-$f"; done
            grep -n -A40 "FATAL EXCEPTION" logcat.txt | head -80 || true
            grep -n -B2 -A30 "AndroidRuntime" logcat.txt | head -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuerda-test
          path: |
            logcat.txt
            shot.png
