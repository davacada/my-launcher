name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk my-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: my-launcher
          path: my-launcher.apk

      - name: Publish as a release (easy to download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: My Launcher ${{ github.run_number }}
          files: my-launcher.apk
          make_latest: true
