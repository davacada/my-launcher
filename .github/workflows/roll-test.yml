name: Roll test

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build Roll
        run: gradle :roll:assembleDebug --no-daemon -q
      - name: Make test media
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac a.mp4
          ffmpeg -loglevel error -f lavfi -i "mandelbrot=size=720x1280:rate=30" -f lavfi -i sine=frequency=660 -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac b.mp4
          ffmpeg -loglevel error -f lavfi -i "smptehdbars=size=1600x1200" -frames:v 1 c.jpg
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r roll/build/outputs/apk/debug/roll-debug.apk
            adb push a.mp4 b.mp4 c.jpg /data/local/tmp/
            adb shell run-as com.davacada.roll mkdir -p files/selftest
            for f in a.mp4 b.mp4 c.jpg; do adb shell run-as com.davacada.roll cp /data/local/tmp/$f files/selftest/$f; done
            adb logcat -c
            adb shell am start -n com.davacada.roll/.RollActivity --es selftest 1
            n=0; done=0
            for i in $(seq 1 200); do
              sleep 1
              adb logcat -d -s ROLLTEST:I > rt.txt
              c=$(grep -c "shot " rt.txt || true)
              while [ $n -lt $c ]; do sleep 1.2; adb exec-out screencap -p > shot$n.png; n=$((n+1)); done
              if grep -q "export ok\|export failed\|failed:" rt.txt; then done=1; break; fi
            done
            cat rt.txt
            adb logcat -d > logcat.txt || true
            P=$(grep -o "export ok [^ ]*" rt.txt | awk '{print $3}')
            if [ -n "$P" ]; then adb shell run-as com.davacada.roll cat "$P" > out.mp4; fi
            ls -la out.mp4 || true
            for f in shot*.png; do echo "BEGIN-$f"; base64 -w0 $f; echo; echo "END-$f"; done
            if [ -s out.mp4 ]; then
              ffprobe -v error -show_entries stream=codec_type,width,height,duration -of compact out.mp4
              for t in 1.5 3.5 4.0 4.5 6.0 7.2 8.5 12.0; do ffmpeg -loglevel error -ss $t -i out.mp4 -frames:v 1 -vf scale=270:-2 ex_$t.png; done
              ffmpeg -loglevel error -i ex_1.5.png -i ex_3.5.png -i ex_4.0.png -i ex_4.5.png -i ex_6.0.png -i ex_7.2.png -i ex_8.5.png -i ex_12.0.png -filter_complex hstack=inputs=8 sheet.png
              echo "BEGIN-sheet"; base64 -w0 sheet.png; echo; echo "END-sheet"
            fi
            grep -n -A30 "FATAL EXCEPTION" logcat.txt | head -60 || true
            grep -n "ROLLTEST\|Transformer\|ExportException\|VideoFrameProcessing" logcat.txt | head -60 || true
